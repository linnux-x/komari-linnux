name: Release Theme Package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # actions/checkout@v4, pinned 2026-07-29
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # actions/setup-node@v4, pinned 2026-07-29
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint project
        run: npm run lint

      - name: Audit dependencies
        run: npm run test:security

      - name: Build project
        run: npm run build

      - name: Update theme configuration
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Get current date in YY.MM.DD format
          VERSION_DATE=$(date +"%y.%m.%d")
          # Get commit hash (short)
          COMMIT_HASH=$(git rev-parse --short HEAD)

          echo "VERSION_DATE=${VERSION_DATE}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV

          # Write release version (tag) to komari-theme.json, strip leading 'v' prefix
          CLEAN_VERSION="${RELEASE_VERSION#v}"
          jq --arg version "$CLEAN_VERSION" \
             '.version = $version' \
             komari-theme.json > komari-theme-updated.json

          mv komari-theme-updated.json komari-theme.json

          echo "Updated theme configuration:"
          cat komari-theme.json

      - name: Verify required files exist
        run: |
          echo "Checking required files..."
          ls -la preview.png || (echo "preview.png not found" && exit 1)
          ls -la komari-theme.json || (echo "komari-theme.json not found" && exit 1)
          ls -la dist/ || (echo "dist/ directory not found" && exit 1)
          echo "All required files found!"

      - name: Create theme package
        id: package
        run: |
          # Create a temporary directory for the package
          mkdir -p theme-package

          # Copy required files
          cp preview.png theme-package/
          cp komari-theme.json theme-package/
          cp -r dist/ theme-package/

          # Create a clearly named theme package, e.g., komari-linnux-v1.0.0.zip
          ZIP_NAME="komari-linnux-${RELEASE_VERSION}.zip"

          cd theme-package
          zip -r ../${ZIP_NAME} .
          cd ..

          # Expose as step output for later steps
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "Created package: ${ZIP_NAME}"
          ls -la ${ZIP_NAME}

      - name: Upload Release Asset
        # softprops/action-gh-release@v2, pinned 2026-07-29
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ steps.package.outputs.zip_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
